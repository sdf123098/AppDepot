name: Build and Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3.4, v1.2.3.4, 1.0.0.1-beta)"
        required: true
        default: "1.0.0.0"
        type: string
      publish_store:
        description: "After review, upload this package and submit Store certification"
        required: true
        default: false
        type: boolean
      store_product_id:
        description: "Partner Center / Microsoft Store Product ID (required when publishing)"
        required: false
        default: "9P15TS1PG7J8"
        type: string
      confirm_store_publish:
        description: "Type PUBLISH to authorize the irreversible Store submission"
        required: false
        default: ""
        type: string

jobs:
  prepare:
    name: Prepare Release Version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      numeric_version: ${{ steps.version.outputs.numeric_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Normalize and Validate Version
        id: version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          PUBLISH_STORE: ${{ github.event.inputs.publish_store }}
          STORE_PRODUCT_ID: ${{ github.event.inputs.store_product_id }}
          CONFIRM_STORE_PUBLISH: ${{ github.event.inputs.confirm_store_publish }}
        run: |
          $raw = "$env:VERSION_INPUT".Trim()
          if ([string]::IsNullOrWhiteSpace($raw)) { throw "Version input cannot be empty." }
          $normalized = if ($raw.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) { $raw.Substring(1) } else { $raw }
          if ($normalized -notmatch '^([\d\.]+)(-[A-Za-z0-9\.\-]+)?$') { throw "Invalid version '$raw'." }
          $numericPart = $Matches[1]
          $parts = $numericPart.Split('.')
          if ($parts.Count -ne 4) { throw "Version must contain exactly four numeric components." }
          $parsed = $null
          if (-not [System.Version]::TryParse($numericPart, [ref]$parsed)) { throw "Invalid numeric version '$numericPart'." }
          "release_version=$normalized" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "numeric_version=$numericPart" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=v$normalized" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:PUBLISH_STORE -eq 'true' -and ([string]::IsNullOrWhiteSpace($env:STORE_PRODUCT_ID) -or $env:CONFIRM_STORE_PUBLISH -ne 'PUBLISH')) {
            throw "Store publication requires a Product ID and confirm_store_publish=PUBLISH."
          }

  test:
    name: Build and test
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.numeric_version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        shell: pwsh
        run: dotnet restore Raven.sln
      - name: Publish x64 test payload
        shell: pwsh
        run: >
          dotnet publish Raven/Raven.csproj -c Release -r win-x64 --self-contained true
          -p:WindowsAppSDKSelfContained=true -p:DebugSymbols=false -p:DebugType=None
          -p:Version=$env:VERSION -p:AssemblyVersion=$env:VERSION -p:FileVersion=$env:VERSION
          -o ./test-publish
      - name: Run localization smoke test
        shell: pwsh
        run: >
          dotnet run --project tests/LocalizationSmoke/LocalizationSmoke.csproj --no-restore
          -p:RavenPublishDir=./test-publish

  build:
    name: Build ${{ matrix.arch }} artifacts
    needs: [prepare, test]
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86, arm64]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      NUMERIC_VERSION: ${{ needs.prepare.outputs.numeric_version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      ARCH: ${{ matrix.arch }}
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Verify .NET 10 SDK
        shell: pwsh
        run: |
          $sdkVersion = (& dotnet --version).Trim()
          if (-not $sdkVersion.StartsWith('10.')) { throw "Expected .NET 10 SDK, found '$sdkVersion'." }
      - name: Ensure VC++ ARM64 Tools
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $msvcRoot = Join-Path $vsPath 'VC\Tools\MSVC'
          $hasArm64Tools = Get-ChildItem -Path $msvcRoot -Filter link.exe -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object FullName -match '\\bin\\Hostx64\\arm64\\link\.exe$' | Select-Object -First 1
          if (-not $hasArm64Tools) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $proc = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$vsPath`"", '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64',
              '--quiet', '--norestart', '--force', '--nocache')
            if ($proc.ExitCode -notin 0, 3010) { throw "VS installer failed with exit code $($proc.ExitCode)." }
          }
      - name: Setup MSVC Toolchain (for NativeAOT)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || matrix.arch == 'x86' && 'amd64_x86' || 'amd64' }}
      - name: Cache NuGet Packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publish self-contained app
        shell: pwsh
        run: >
          dotnet publish Raven/Raven.csproj -c Release -r win-$env:ARCH --self-contained true
          -p:WindowsAppSDKSelfContained=true -p:DebugSymbols=false -p:DebugType=None
          -p:Version=$env:NUMERIC_VERSION -p:AssemblyVersion=$env:NUMERIC_VERSION
          -p:FileVersion=$env:NUMERIC_VERSION -p:InformationalVersion=$env:RELEASE_TAG
          -o ./publish_output
      - name: Publish NativeAOT updater
        shell: pwsh
        run: >
          dotnet publish Raven.Updater/Raven.Updater.csproj -c Release -r win-$env:ARCH
          -p:PublishAot=true -p:IlcUseEnvironmentalTools=true -p:Version=$env:NUMERIC_VERSION
          -p:AssemblyVersion=$env:NUMERIC_VERSION -p:FileVersion=$env:NUMERIC_VERSION -o ./updater_aot
      - name: Replace updater with NativeAOT build
        shell: pwsh
        run: |
          $aotUpdater = './updater_aot/Raven.Updater.exe'
          if (-not (Test-Path -LiteralPath $aotUpdater)) { throw "NativeAOT updater was not produced at $aotUpdater." }
          Get-ChildItem -Path './publish_output' -Filter 'Raven.Updater.*' -File | Remove-Item -Force
          Copy-Item -LiteralPath $aotUpdater -Destination './publish_output/Raven.Updater.exe' -Force
      - name: Create unsigned Store MSIX
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STORE_IDENTITY_NAME) -or
              [string]::IsNullOrWhiteSpace($env:STORE_PUBLISHER) -or
              [string]::IsNullOrWhiteSpace($env:STORE_PUBLISHER_DISPLAY_NAME)) {
            throw 'Set STORE_IDENTITY_NAME, STORE_PUBLISHER, and STORE_PUBLISHER_DISPLAY_NAME repository Variables from Partner Center before creating a Store package.'
          }
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      - name: Package unsigned Store MSIX
        shell: pwsh
        run: >
          ./scripts/New-AppDepotMsix.ps1 -PublishDirectory ./publish_output
          -OutputPath "./store-msix/AppDepot-$env:RELEASE_VERSION-win-$env:ARCH.msix"
          -Architecture $env:ARCH -Version $env:NUMERIC_VERSION
          -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER
          -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME
      - name: Create portable ZIP
        shell: pwsh
        run: >
          ./scripts/New-AppDepotPortableZip.ps1 -PublishDirectory ./publish_output
          -OutputPath "./portable/AppDepot-$env:RELEASE_VERSION-windows-$env:ARCH.zip"
      - name: Upload Store package artifact
        uses: actions/upload-artifact@v7
        with:
          name: Store-MSIX-${{ matrix.arch }}
          path: store-msix/*.msix
          if-no-files-found: error
          retention-days: 90
      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: Portable-${{ matrix.arch }}
          path: portable/*.zip
          if-no-files-found: error

  store-bundle:
    name: Assemble Store MSIXBundle
    needs: [prepare, build]
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Download architecture packages
        uses: actions/download-artifact@v8
        with:
          pattern: Store-MSIX-*
          path: store-msix
          merge-multiple: true
      - name: Create unsigned Store MSIXBundle
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.numeric_version }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: >
          ./scripts/New-AppDepotMsixBundle.ps1 -InputDirectory ./store-msix
          -OutputPath "./store-msix/AppDepot-$env:RELEASE_VERSION-windows.msixbundle"
          -Version $env:VERSION
      - name: Create Store upload package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: >
          ./scripts/New-AppDepotMsixUpload.ps1
          -BundlePath "./store-msix/AppDepot-$env:RELEASE_VERSION-windows.msixbundle"
          -OutputPath "./store-msix/AppDepot-$env:RELEASE_VERSION-windows.msixupload"
      - name: Upload Store bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: Store-MSIXBundle
          path: store-msix/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create Draft GitHub Release
    needs: [prepare, build, store-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download portable artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Portable-*
          path: ./artifacts
          merge-multiple: true
      - name: Calculate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath './artifacts' -Filter '*.zip' -File | Sort-Object Name)
          if ($files.Count -ne 3) { throw "Expected three portable ZIP artifacts, found $($files.Count)." }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines('./artifacts/SHA256SUMS.txt', $lines, [System.Text.UTF8Encoding]::new($false))
      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: AppDepot ${{ needs.prepare.outputs.release_tag }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.release_version != needs.prepare.outputs.numeric_version }}
          generate_release_notes: true
          body: |
            ## Windows distribution

            - Microsoft Store: submit the `Store-MSIXBundle` workflow artifact to Partner Center. Microsoft signs Store MSIX packages after certification.
            - Portable fallback: download the architecture-specific ZIP below and verify `SHA256SUMS.txt`.
            - WinGet: use the Microsoft Store source when the Store listing is available. A community manifest is only needed if the Store package is not discoverable there.
          files: |
            ./artifacts/AppDepot-*-windows-*.zip
            ./artifacts/SHA256SUMS.txt

  store-publish:
    name: Submit package to Microsoft Store
    needs: [prepare, build, store-bundle]
    if: ${{ inputs.publish_store == true && inputs.confirm_store_publish == 'PUBLISH' && inputs.store_product_id != '' }}
    runs-on: windows-latest
    environment: microsoft-store-production
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Download Store bundle
        uses: actions/download-artifact@v8
        with:
          name: Store-MSIXBundle
          path: store-msix
      - name: Show publication plan
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.numeric_version }}
          PRODUCT_ID: ${{ inputs.store_product_id }}
        run: |
          Write-Host "Store publication plan"
          Write-Host "Version: $env:VERSION"
          Write-Host "Store Product ID: $env:PRODUCT_ID"
          Get-ChildItem -LiteralPath './store-msix' -Include '*.msixbundle', '*.msixupload' -File |
            Select-Object FullName, Length
          Write-Host "Metadata: existing Partner Center listing is preserved; no guessed legal/listing fields are changed."
          Write-Host "Authorization: workflow_dispatch publish_store=true and confirm_store_publish=PUBLISH."
      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Configure Store credentials
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: >
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID
          --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
      - name: Upload package and submit certification
        shell: pwsh
        env:
          PRODUCT_ID: ${{ inputs.store_product_id }}
        run: |
          $upload = Get-ChildItem -LiteralPath './store-msix' -Filter '*.msixupload' | Select-Object -First 1
          if (-not $upload) { throw 'Store MSIX upload package was not found.' }
          # Upload the package while keeping the submission draft, then publish
          # that exact draft explicitly. This follows the official CLI flow and
          # makes the irreversible certification submission visible in logs.
          msstore publish "$PWD\Raven" --inputFile $upload.FullName --appId $env:PRODUCT_ID --noCommit
          msstore submission publish $env:PRODUCT_ID
          msstore submission status $env:PRODUCT_ID
